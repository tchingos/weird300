title: Weird 300
description: >-
  Visits to the 300 curious corners, wild wonders, and sublime structures
  in Dave Hamilton's Weird Guide Britain.
baseurl: /weird300
url: https://tchingos.github.io
total_places: 300
timezone: Europe/London

# Journal posts (_posts/) live under /journal/.
permalink: /journal/:title/

collections:
  places:
    output: true
    permalink: /places/:name/

defaults:
  - scope: { path: "", type: places }
    values: { layout: place }
  - scope: { path: "", type: posts }
    values: { layout: post }

sass:
  style: compressed

exclude: [scripts, inbox, README.md, CLAUDE.md, .claude, .github]
