title: Weird 300
description: >-
  Visits to curious corners, wild wonders, and sublime structures in
  Dave Hamilton's Weird Guide Britain.
baseurl: /weird300
url: https://tchingos.github.io
total_places: 300
timezone: Europe/London

# GoatCounter site code, as in <code>.goatcounter.com. Leave it unset and no
# analytics script is loaded at all.
goatcounter: weird300

# Journal posts (_posts/) live under /journal/.
permalink: /journal/:title/

collections:
  places:
    output: true
    permalink: /places/:name/

defaults:
  - scope: { path: "", type: places }
    values: { layout: place }
  - scope: { path: "", type: posts }
    values: { layout: post }

sass:
  style: compressed

exclude: [scripts, inbox, originals, README.md, CLAUDE.md, .claude, .github]
