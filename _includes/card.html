{%- comment -%}
  A grid card linking to a place or journal post.
  Params: doc, kicker (small line above the title), meta (line below it).
{%- endcomment -%}
{% assign cover = include.doc.photos | first %}
<a class="card" href="{{ include.doc.url | relative_url }}">
  <div class="card-img">
    {% if cover %}<img loading="lazy" src="{% include photo-url.html doc=include.doc file=cover.file %}" alt=""{% if cover.focus %} style="object-position: {{ cover.focus }}"{% endif %}>{% endif %}
  </div>
  <span class="card-cat">{{ include.kicker }}</span>
  <strong>{{ include.doc.title }}</strong>
  <span class="card-meta">{{ include.meta }}</span>
</a>
