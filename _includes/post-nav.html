{%- comment -%} Older and newer journal posts. Params: post. {%- endcomment -%}
<nav class="place-nav" aria-label="More journal posts">
  {% if include.post.previous %}
  <a class="prev" href="{{ include.post.previous.url | relative_url }}"><span>Older</span>{{ include.post.previous.title }}</a>
  {% else %}<span></span>{% endif %}
  <a class="all" href="{{ '/journal/' | relative_url }}">All journal posts</a>
  {% if include.post.next %}
  <a class="next" href="{{ include.post.next.url | relative_url }}"><span>Newer</span>{{ include.post.next.title }}</a>
  {% else %}<span></span>{% endif %}
</nav>
