{%- comment -%}
  Light and dark switch, shown at the end of the site nav. It ships hidden and
  assets/js/theme.js reveals it, so a visitor with no JavaScript is never given
  a control that cannot work. The icon shows the theme you are in; the label
  says where clicking takes you.
{%- endcomment -%}
<button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark theme" hidden>
  <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.4v2.6M12 19v2.6M4.2 12H1.6M22.4 12h-2.6M6.5 6.5 4.6 4.6M19.4 19.4l-1.9-1.9M6.5 17.5l-1.9 1.9M19.4 4.6l-1.9 1.9"/>
  </svg>
  <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20.8 13.4A8.6 8.6 0 1 1 10.6 3.2a6.9 6.9 0 0 0 10.2 10.2z"/>
  </svg>
</button>
