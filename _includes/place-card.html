{%- comment -%} A grid card linking to one place. Params: place. {%- endcomment -%}
{% assign cover = include.place.photos | first %}
<a class="card" href="{{ include.place.url | relative_url }}">
  <div class="card-img">
    {% if cover %}<img loading="lazy" src="{% include photo-url.html place=include.place file=cover.file %}" alt="">{% endif %}
  </div>
  <span class="card-cat">{{ include.place.category }}</span>
  <strong>{{ include.place.title }}</strong>
  <span class="card-meta">{{ include.place.region }} · {{ include.place.visited | date: "%B %Y" }}</span>
</a>
